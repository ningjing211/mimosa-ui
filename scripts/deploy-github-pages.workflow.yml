# Copy this file to: .github/workflows/deploy-github-pages.yml
# (GitHub PAT push 若無 `workflow` scope，無法直接推送 workflows 目錄；可於網頁 New file 貼上。)
#
# After enable: Repo → Settings → Pages → Source: GitHub Actions.
# Site: https://<owner>.github.io/<repo>/design-system.html

name: Deploy design system (GitHub Pages)

on:
  push:
    branches: [main, master]
    paths:
      - "mock-up/web-home/v16-psychedelic/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: mock-up/web-home/v16-psychedelic

      - id: deployment
        uses: actions/deploy-pages@v4
